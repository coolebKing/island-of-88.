<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Island of 88</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b3550; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  #c { position: absolute; display: block; touch-action: none; }
  #nameIn, #codeIn { position: absolute; display: none; border: 3px solid #1d2b3a; border-radius: 12px;
    background: #fffdf3; color: #1d2b3a; font-weight: 800; text-align: center; outline: none;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; box-sizing: border-box; padding: 0 8px; }
  #nameIn:focus, #codeIn:focus { border-color: #ff8a26; }
  #codeIn { text-transform: uppercase; letter-spacing: 6px; }
  #turn { display: none; position: absolute; left: 0; right: 0; top: 12px; text-align: center; color: #ffd23a;
    font: 800 18px "Trebuchet MS", "Segoe UI", system-ui, sans-serif; pointer-events: none; }
  @media (orientation: portrait) and (pointer: coarse) { #turn { display: block; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="turn">↻ Turn your device sideways for a bigger island!</div>
<input id="nameIn" maxlength="12" placeholder="Type your name" autocomplete="off" spellcheck="false">
<input id="codeIn" maxlength="8" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false">
<script>
"use strict";
/* =====================================================================
   ISLAND OF 88 — the 88th Call to Action
   An open-world island with eight sports. Each sport is worth up to
   11 points, and 8 × 11 = 88.
   ===================================================================== */

const W = 960, H = 600, TAU = Math.PI * 2;
const FONT = '"Trebuchet MS","Segoe UI",system-ui,sans-serif';
const OUT = '#2a1c14';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const nameIn = document.getElementById('nameIn'), codeIn = document.getElementById('codeIn');
let VS = 1, now = 0;

/* ---------------------------- helpers ---------------------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const smooth = t => t * t * (3 - 2 * t);
const tri = t => 2 / Math.PI * Math.asin(Math.sin(t));   // like sin, but moves at a steady speed
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rrPath(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function shade(hex, amt) {
  let [r, g, b] = hexRgb(hex);
  const f = amt < 0 ? v => v * (1 + amt) : v => v + (255 - v) * amt;
  return `rgb(${f(r) | 0},${f(g) | 0},${f(b) | 0})`;
}
function fs(fill) { ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); }
function txt(s, x, y, size, col = '#fff', align = 'center', o = {}) {
  ctx.font = `${o.weight || 800} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = o.base || 'middle';
  if (o.stroke) {
    ctx.lineWidth = o.sw || size / 5; ctx.strokeStyle = o.stroke; ctx.lineJoin = 'round';
    ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function wrap(s, maxW, size, weight = 700) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  const out = []; let line = '';
  for (const w of s.split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out;
}
function star(x, y, ro, ri, n = 5, rot = -Math.PI / 2) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? ri : ro, a = rot + i * Math.PI / n;
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}

/* ---------------------------- screen ---------------------------- */
const NAMEBOX = { x: 30, y: 490, w: 322, h: 40 }, CODEBOX = { x: W / 2 - 130, y: 262, w: 260, h: 54 };
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  VS = Math.min(innerWidth / W, innerHeight / H);
  const cw = Math.floor(W * VS), ch = Math.floor(H * VS);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.style.left = Math.floor((innerWidth - cw) / 2) + 'px';
  cv.style.top = Math.floor((innerHeight - ch) / 2) + 'px';
  cv.width = Math.floor(cw * dpr); cv.height = Math.floor(ch * dpr);
  placeNameInput();
}
function placeNameInput() {
  const l = parseFloat(cv.style.left) || 0, t = parseFloat(cv.style.top) || 0;
  Object.assign(nameIn.style, {
    left: (l + NAMEBOX.x * VS) + 'px', top: (t + NAMEBOX.y * VS) + 'px',
    width: (NAMEBOX.w * VS) + 'px', height: (NAMEBOX.h * VS) + 'px', fontSize: (22 * VS) + 'px'
  });
  Object.assign(codeIn.style, {
    left: (l + CODEBOX.x * VS) + 'px', top: (t + CODEBOX.y * VS) + 'px',
    width: (CODEBOX.w * VS) + 'px', height: (CODEBOX.h * VS) + 'px', fontSize: (28 * VS) + 'px'
  });
}
addEventListener('resize', resize);

/* ---------------------------- input ---------------------------- */
const keys = {}, kp = {}, ku = {};
let isTouch = false;
const MUTE = { x: W - 46, y: H - 42, w: 38, h: 34 };
function nk(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key === 'Enter' ? 'enter' : e.key; }
addEventListener('keydown', e => {
  if (document.activeElement === nameIn || document.activeElement === codeIn) {
    if (document.activeElement === codeIn && e.key === 'Enter') joinServer(codeIn.value);
    if (e.key === 'Enter' || e.key === 'Escape') document.activeElement.blur();
    return;
  }
  const k = nk(e);
  if (!keys[k]) kp[k] = true;
  keys[k] = true;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.key)) e.preventDefault();
  audioInit();
});
addEventListener('keyup', e => { const k = nk(e); keys[k] = false; ku[k] = true; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const ptr = { x: -99, y: -99, sx: 0, sy: 0, down: false, pressed: false, released: false,
  id: null, type: 'mouse', moved: 0, dx: 0, dy: 0 };
const touches = new Map();
function toL(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function inside(x, y, w, h, px = ptr.x, py = ptr.y) { return px >= x && px <= x + w && py >= y && py <= y + h; }
cv.addEventListener('pointerdown', e => {
  audioInit();
  if (document.activeElement === nameIn || document.activeElement === codeIn) document.activeElement.blur();
  const p = toL(e);
  e.preventDefault();
  if (inside(MUTE.x, MUTE.y, MUTE.w, MUTE.h, p.x, p.y)) { muted = !muted; saveMute(); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (e.pointerType === 'touch') isTouch = true;
  touches.set(e.pointerId, { x: p.x, y: p.y, sx: p.x, sy: p.y,
    joy: scene === 'world' && isTouch && p.x < W * 0.5 && p.y > H * 0.3 });
  Object.assign(ptr, { type: e.pointerType, id: e.pointerId, x: p.x, y: p.y, sx: p.x, sy: p.y,
    down: true, pressed: true, moved: performance.now() });
});
cv.addEventListener('pointermove', e => {
  const p = toL(e), t = touches.get(e.pointerId);
  if (t) { t.x = p.x; t.y = p.y; }
  if (e.pointerId === ptr.id || e.pointerType === 'mouse') {
    ptr.dx += p.x - ptr.x; ptr.dy += p.y - ptr.y;
    ptr.x = p.x; ptr.y = p.y; ptr.type = e.pointerType; ptr.moved = performance.now();
  }
});
function pUp(e) {
  touches.delete(e.pointerId);
  if (e.pointerId === ptr.id) { ptr.down = false; ptr.released = true; }
}
cv.addEventListener('pointerup', pUp);
cv.addEventListener('pointercancel', pUp);
cv.addEventListener('contextmenu', e => e.preventDefault());
function endFrameInput() {
  for (const k in kp) delete kp[k];
  for (const k in ku) delete ku[k];
  ptr.pressed = ptr.released = false; ptr.dx = ptr.dy = 0;
}
// "do the thing" — space, enter or a tap/click
const act = () => kp[' '] || kp['enter'] || ptr.pressed;

function button(x, y, w, h, label, o = {}) {
  const hov = inside(x, y, w, h) && (!isTouch || ptr.down);
  const pressing = hov && ptr.down && inside(x, y, w, h, ptr.sx, ptr.sy);
  const r = o.r ?? 12, dy = pressing ? 3 : hov ? -1 : 0;
  rrPath(ctx, x, y + 4, w, h, r); ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fill();
  rrPath(ctx, x, y + dy, w, h, r);
  ctx.fillStyle = o.selected ? '#fffbe6' : (o.color || '#ffd23a'); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = o.selected ? '#ff8a26' : '#1d2b3a'; ctx.stroke();
  txt(label, x + w / 2, y + h / 2 + dy + 1, o.size || Math.min(22, h * 0.48), o.tc || '#1d2b3a');
  const clicked = (ptr.released && inside(x, y, w, h) && inside(x, y, w, h, ptr.sx, ptr.sy)) ||
    (o.key && o.key.some(k => kp[k]));
  if (clicked) sfx('click');
  return clicked;
}
function panel(x, y, w, h, fill = '#fffdf3', r = 18) {
  rrPath(ctx, x, y + 6, w, h, r); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fill();
  rrPath(ctx, x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#1d2b3a'; ctx.stroke();
}

/* ---------------------------- sound ---------------------------- */
let AC = null, muted = false, noiseBuf = null;
try { muted = localStorage.getItem('island88.sound') === 'off'; } catch (e) {}
function saveMute() { try { localStorage.setItem('island88.sound', muted ? 'off' : 'on'); } catch (e) {} }
function audioInit() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'sine', v = .2, f2 = null, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .03);
}
function noise(d, v = .2, freq = 1000, type = 'lowpass', delay = 0) {
  if (!AC || muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const a = noiseBuf.getChannelData(0);
    for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + d + .03);
}
const SFX = {
  click: () => tone(660, .07, 'square', .06),
  select: () => { tone(520, .07, 'triangle', .12); tone(780, .09, 'triangle', .12, null, .06); },
  kick: () => { tone(170, .16, 'sine', .45, 50); noise(.08, .2, 2000); },
  bounce: () => tone(230, .1, 'sine', .25, 120),
  swish: () => noise(.28, .14, 3000, 'highpass'),
  whistle: () => { tone(2300, .12, 'square', .05, 2500); tone(2300, .3, 'square', .05, 2500, .15); },
  cheer: () => { noise(1.1, .1, 1600, 'bandpass'); [523, 659, 784].forEach((f, i) => tone(f, .22, 'triangle', .1, null, i * .08)); },
  fail: () => { tone(300, .25, 'sawtooth', .07, 150); tone(200, .35, 'sawtooth', .07, 90, .2); },
  star: () => tone(880, .09, 'triangle', .12, 1500),
  hit: () => { tone(120, .2, 'square', .13, 60); noise(.15, .2, 800); },
  splash: () => { noise(.6, .25, 1400); tone(500, .3, 'sine', .08, 120); },
  pin: () => { tone(900, .06, 'triangle', .1, 600); noise(.06, .12, 4000, 'highpass'); },
  thunk: () => { tone(150, .1, 'sine', .35, 80); noise(.05, .18, 3000); },
  step: () => noise(.035, .025, 700),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, 'triangle', .14, null, i * .12)),
  talk: () => tone(rand(320, 520), .045, 'square', .03),
  jump: () => tone(300, .15, 'square', .07, 650),
  beep: () => tone(660, .15, 'square', .08),
  go: () => tone(990, .35, 'square', .09),
  boom: () => { noise(.8, .3, 400); tone(80, .6, 'sine', .3, 40); },
  rumble: () => noise(1.4, .18, 160),
};
function sfx(n) { try { SFX[n] && SFX[n](); } catch (e) {} }

/* ---------------------------- save ---------------------------- */
const SAVE_KEY = 'island88.save.v1';
let save = { char: null, best: {}, pos: null, introSeen: false, champion: false, perfect: false, tp: ['plaza'] };
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* =====================================================================
   CHARACTERS — every body part is its own choice
   ===================================================================== */
const SKIN = ['#ffe3c8', '#f5c8a0', '#e2a878', '#c48552', '#9a5d35', '#6a3d22', '#9be08f', '#a8c8ff'];
const HAIRC = ['#1d1510', '#5b3520', '#a5622c', '#efc35e', '#d8482a', '#f4f4f4', '#ff6fb5', '#46b4ff', '#5ad35a', '#9d5bff'];
const CLOTH = ['#e8443a', '#ff8a26', '#ffd23a', '#44c45a', '#18a7b5', '#3a66e8', '#8a4ae8', '#ff6fb5', '#ffffff', '#2b2f36', '#8a5a38', '#0e7a55', '#c9a26b'];
const EYEC = ['#2b1b10', '#2f6fd6', '#3c9a4a', '#8a5a2a', '#7a3ad6', '#e0342c', '#18a7b5'];

const TABS = [
  { name: 'Head', key: 'head', opts: ['Round', 'Oval', 'Square', 'Bean', 'Wide'], ck: 'skin', pal: SKIN, cl: 'Skin colour', zoom: 2.7, focus: 'head' },
  { name: 'Hair', key: 'hair', opts: ['Short', 'Spiky', 'Long', 'Braids', 'Curly', 'Mohawk', 'Ponytail', 'Afro', 'Buns', 'Bald'], ck: 'hairColor', pal: HAIRC, cl: 'Hair colour', zoom: 2.2, focus: 'hair' },
  { name: 'Eyes', key: 'eyes', opts: ['Dots', 'Big Shiny', 'Sleepy', 'Fierce', 'Happy', 'Wink', 'Starry', 'Shades'], ck: 'eyeColor', pal: EYEC, cl: 'Eye colour', zoom: 4, focus: 'eyes' },
  { name: 'Mouth', key: 'mouth', opts: ['Smile', 'Big Grin', 'Open', 'Smirk', 'Tongue', 'Flat', 'Teeth', 'Moustache'], zoom: 4, focus: 'mouth' },
  { name: 'Body', key: 'body', opts: ['Regular', 'Stocky', 'Tall', 'Tiny', 'Strong'], zoom: 1.4, focus: 'all' },
  { name: 'Shirt', key: 'shirt', opts: ['T-Shirt', 'Ribbon Shirt', 'Tank Top', 'Jersey 88', 'Hoodie', 'Stripes', 'Hawaiian', 'Hero Cape'], ck: 'shirtColor', pal: CLOTH, cl: 'Shirt colour', zoom: 2.3, focus: 'torso' },
  { name: 'Arms', key: 'arms', opts: ['Regular', 'Buff', 'Skinny', 'Wristbands', 'Robot', 'Gloves'], ck: 'armColor', pal: CLOTH, cl: 'Band & glove colour', zoom: 2.2, focus: 'torso' },
  { name: 'Legs', key: 'legs', opts: ['Shorts', 'Long Pants', 'Swim Trunks', 'Skirt', 'Ribbon Skirt', 'Track Pants'], ck: 'pantsColor', pal: CLOTH, cl: 'Pants colour', zoom: 2.6, focus: 'legs' },
  { name: 'Feet', key: 'feet', opts: ['Sneakers', 'Moccasins', 'Flip-Flops', 'Boots', 'Bare Feet', 'Cleats', 'Roller Skates'], ck: 'shoeColor', pal: CLOTH, cl: 'Shoe colour', zoom: 3.4, focus: 'feet' },
  { name: 'Hat & More', key: 'hat', opts: ['None', 'Beaded Earrings', 'Cap', 'Crown', 'Headband', 'Sun Hat', 'Beanie', 'Bandana', 'Propeller', 'Flower'], ck: 'hatColor', pal: CLOTH, cl: 'Hat & bead colour', zoom: 2.1, focus: 'hat' },
];
function defaultChar() {
  return { name: '', head: 'Round', skin: SKIN[2], hair: 'Braids', hairColor: HAIRC[0], eyes: 'Big Shiny', eyeColor: EYEC[1],
    mouth: 'Smile', body: 'Regular', shirt: 'Jersey 88', shirtColor: CLOTH[5], arms: 'Regular', armColor: CLOTH[2],
    legs: 'Shorts', pantsColor: CLOTH[9], feet: 'Sneakers', shoeColor: CLOTH[0], hat: 'None', hatColor: CLOTH[0] };
}
function randomChar(rng = Math.random, indig = false) {
  const c = defaultChar(), p = a => a[Math.floor(rng() * a.length)];
  for (const t of TABS) { c[t.key] = p(t.opts); if (t.ck) c[t.ck] = p(t.pal); }
  if (rng() < .85) c.skin = SKIN[Math.floor(rng() * 6)];
  if (rng() < .7) c.hairColor = HAIRC[Math.floor(rng() * 6)];
  if (rng() < .45) c.hat = 'None';
  if (indig) {   // the people of the island
    c.skin = SKIN[1 + Math.floor(rng() * 5)];
    c.hairColor = rng() < .85 ? HAIRC[Math.floor(rng() * 2)] : HAIRC[5];
    c.eyeColor = rng() < .8 ? EYEC[0] : EYEC[3];
    if (rng() < .7) c.hair = p(['Braids', 'Braids', 'Long', 'Ponytail', 'Short', 'Buns']);
    if (rng() < .45) c.shirt = 'Ribbon Shirt';
    if (rng() < .3) c.legs = 'Ribbon Skirt';
    if (rng() < .45) { c.feet = 'Moccasins'; c.shoeColor = p(['#c9a26b', '#8a5a38', '#c9a26b']); }
    c.hat = rng() < .35 ? 'Beaded Earrings' : rng() < .5 ? 'None' : c.hat;
    if (c.hat === 'Crown' || c.hat === 'Propeller') c.hat = 'None';
    if (c.eyes === 'Starry') c.eyes = 'Big Shiny';
  }
  return c;
}
const BODY = {
  Regular: { tw: 20, th: 18, ll: 11, aw: 6 },
  Stocky: { tw: 27, th: 17, ll: 9, aw: 7 },
  Tall: { tw: 19, th: 22, ll: 16, aw: 6 },
  Tiny: { tw: 17, th: 14, ll: 8, aw: 5 },
  Strong: { tw: 25, th: 20, ll: 12, aw: 8 },
};
function geo(c) {
  const b = BODY[c.body] || BODY.Regular;
  const legTop = -(3 + b.ll), torsoBot = legTop + 2, torsoTop = torsoBot - b.th;
  return { ...b, legTop, torsoBot, torsoTop, headCY: torsoTop - 11 };
}
function headDims(c) {
  switch (c.head) {
    case 'Oval': return [12, 15];
    case 'Square': return [13.5, 13.5];
    case 'Bean': return [13, 15];
    case 'Wide': return [16.5, 12.5];
    default: return [14, 14];
  }
}
// how tall a character is (for name tags and speech bubbles)
function charTop(c) { const g = geo(c), [, hh] = headDims(c); return g.headCY - hh - 6; }

function headPath(cy, c) {
  const [hw, hh] = headDims(c);
  if (c.head === 'Square') { rrPath(ctx, -hw, cy - hh, hw * 2, hh * 2, 6); return; }
  ctx.beginPath();
  if (c.head === 'Bean') {
    ctx.moveTo(0, cy - hh);
    ctx.bezierCurveTo(hw * .9, cy - hh, hw * 1.15, cy + hh * .2, hw * .95, cy + hh * .6);
    ctx.bezierCurveTo(hw * .7, cy + hh * 1.05, -hw * .7, cy + hh * 1.05, -hw * .95, cy + hh * .6);
    ctx.bezierCurveTo(-hw * 1.15, cy + hh * .2, -hw * .9, cy - hh, 0, cy - hh);
    ctx.closePath();
  } else ctx.ellipse(0, cy, hw, hh, 0, 0, TAU);
}

/* options for drawChar:
   back  – seen from behind     walk – walk-cycle phase (null = standing)
   arms  – 'up' | 'wave' | 'hold' | 'down'
   rot   – lean / tumble angle   shadow – false to hide the ground shadow   t – time */
function drawChar(c, x, y, s, o = {}) {
  const g = geo(c), [hw, hh] = headDims(c), t = o.t ?? now, back = !!o.back, p = o.walk;
  const moving = p != null;
  const lift = k => moving ? Math.max(0, Math.sin(p + k * Math.PI)) * 2.4 : 0;
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 1.3; ctx.strokeStyle = OUT;
  if (o.shadow !== false) {
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0, .5, g.tw * .62, 3.6, 0, 0, TAU); ctx.fill();
  }
  if (o.hop) ctx.translate(0, -o.hop);
  if (o.rot) { ctx.translate(0, -16); ctx.rotate(o.rot); ctx.translate(0, 16); }

}

function drawCape(c, g) {

}

function drawLegs(c, g, lift) {

}

function drawFoot(c, lx, ly, sd) {

      break;
    case 'Roller Skates':

function drawTorso(c, g, back) {

const SLEEVE = { 'Ribbon Shirt': 1, 'T-Shirt': .42, 'Jersey 88': .42, 'Stripes': .42, 'Hawaiian': .45, 'Hoodie': 1, 'Hero Cape': 1, 'Tank Top': 0 };
function drawArms(c, g, p, o, back) {
  const sw = c.arms === 'Buff' ? 1.45 : c.arms === 'Skinny' ? .65 : 1;
  const aw = g.aw * sw, len = (g.torsoBot - g.torsoTop) + 1, sl = SLEEVE[c.shirt] || 0;
  const robot = c.arms === 'Robot', armSkin = robot ? '#b8c2cf' : c.skin;
  for (const sd of [-1, 1]) {
    let a = -sd * .16;
    if (p != null) a += Math.sin(p) * .25 * sd;
    if (o.arms === 'up') a = -sd * 2.7 + Math.sin(now * 6 + sd) * .1;
    else if (o.arms === 'wave' && sd === 1) a = -2.5 + Math.sin(now * 10) * .35;
    else if (o.arms === 'hold' && sd === (back ? -1 : 1)) a = -sd * 1.1;
    else if (o.arms === 'down') a = -sd * .05;
    ctx.save();
    ctx.translate(sd * (g.tw / 2 - aw * .3), g.torsoTop + 2.5); ctx.rotate(a);
    rrPath(ctx, -aw / 2, -1, aw, len, aw / 2); fs(armSkin);
    if (c.arms === 'Buff') { ctx.beginPath(); ctx.ellipse(sd * aw * .2, len * .32, aw * .55, len * .2, 0, 0, TAU); fs(armSkin); }
    if (robot) {
      ctx.beginPath(); ctx.moveTo(-aw / 2, len * .48); ctx.lineTo(aw / 2, len * .48); ctx.stroke();
      ctx.fillStyle = '#5f6b78'; ctx.beginPath(); ctx.arc(0, len * .48, 1, 0, TAU); ctx.fill();
    }
    if (sl > 0) { rrPath(ctx, -aw / 2 - .6, -1.5, aw + 1.2, len * sl + 1.5, aw / 2); fs(c.shirt === 'Hero Cape' ? c.shirtColor : c.shirtColor); }
    if (c.arms === 'Wristbands') { rrPath(ctx, -aw / 2 - .6, len - 4.8, aw + 1.2, 3.2, 1); fs(c.armColor); }
    const hr = aw * .55 + 1;
    ctx.beginPath();
    if (c.arms === 'Gloves') { ctx.arc(0, len + .5, hr * 1.55, 0, TAU); fs(c.armColor); }
    else { ctx.arc(0, len + .5, hr, 0, TAU); fs(robot ? '#8b96a3' : c.skin); }
    if (o.hold && sd === (back ? -1 : 1)) o.hold(len + .5);
    ctx.restore();
  }
}

function drawFace(c, g, hw, hh, t, o) {
  const cy = g.headCY, ey = cy + hh * .1, ex = hw * .42, my = cy + hh * .52, E = c.eyes, dark = '#20140e';
  ctx.fillStyle = 'rgba(255,110,120,.32)';
  for (const sd of [-1, 1]) { ctx.beginPath(); ctx.arc(sd * hw * .62, my - 2.2, 2.3, 0, TAU); ctx.fill(); }
  const blink = !o.noBlink && ((t + (c.name || '').length * .7) % 4.2) < .12 && E !== 'Shades' && E !== 'Happy';
  if (E === 'Shades') {
    ctx.fillStyle = '#121212';
    for (const sd of [-1, 1]) { rrPath(ctx, sd * ex - 3.8, ey - 2.7, 7.6, 5.4, 2); ctx.fill(); }
    ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-ex + 3.5, ey - 1.4); ctx.lineTo(ex - 3.5, ey - 1.4);
    ctx.moveTo(-ex - 3.6, ey - 1.6); ctx.lineTo(-hw + .5, ey - 2.4); ctx.moveTo(ex + 3.6, ey - 1.6); ctx.lineTo(hw - .5, ey - 2.4);
    ctx.strokeStyle = '#121212'; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.beginPath();
    for (const sd of [-1, 1]) { ctx.moveTo(sd * ex - 2, ey); ctx.lineTo(sd * ex, ey - 2); }
    ctx.stroke(); ctx.strokeStyle = OUT; ctx.lineWidth = 1.3;
  } else for (const sd of [-1, 1]) {
    const x = sd * ex;
    if (blink) { ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x - 2.4, ey); ctx.lineTo(x + 2.4, ey); ctx.stroke(); ctx.lineWidth = 1.3; continue; }
    const dot = (r) => { ctx.beginPath(); ctx.arc(x, ey, r, 0, TAU); ctx.fillStyle = c.eyeColor === EYEC[0] ? dark : c.eyeColor; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - .6, ey - .7, .6, 0, TAU); ctx.fill(); };
    const happy = () => { ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(x, ey + 1.3, 2.6, Math.PI + .25, TAU - .25); ctx.stroke(); ctx.lineWidth = 1.3; };
    switch (E) {

        ctx.fillStyle = c.eyeColor; ctx.beginPath(); ctx.arc(x, ey + .5, 2.4, 0, TAU); ctx.fill();
        ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(x, ey + .6, 1.25, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - .9, ey - .6, .9, 0, TAU); ctx.fill();
        break;
      case 'Sleepy':
        ctx.beginPath(); ctx.arc(x, ey, 2.4, 0, Math.PI); ctx.fillStyle = dark; ctx.fill();
        ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x - 3, ey); ctx.lineTo(x + 3, ey); ctx.stroke(); ctx.lineWidth = 1.3;
        break;
      case 'Fierce':

        break;
      case 'Happy': happy(); break;
      case 'Wink': if (sd < 0) dot(2.1); else happy(); break;
      case 'Starry': star(x, ey, 3.4, 1.5); fs('#ffd23a'); break;
    }

  const smile = () => { ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(0, my - 2.6, 3.6, .2 * Math.PI, .8 * Math.PI); ctx.stroke(); ctx.lineWidth = 1.3; };
  switch (c.mouth) {
    case 'Smile': smile(); break;
    case 'Big Grin':
      ctx.beginPath(); ctx.moveTo(-4.5, my - 1.5); ctx.arc(0, my - 1.5, 4.5, 0, Math.PI); ctx.closePath(); fs('#5a1f1f');
      ctx.fillStyle = '#fff'; ctx.fillRect(-3.4, my - 1.4, 6.8, 1.5);
      ctx.fillStyle = '#ff7f97'; ctx.beginPath(); ctx.ellipse(0, my + 1.7, 2.2, 1.1, 0, 0, TAU); ctx.fill();
      break;
    case 'Open':
      ctx.beginPath(); ctx.ellipse(0, my, 2.4, 3, 0, 0, TAU); fs('#5a1f1f');
      ctx.fillStyle = '#ff7f97'; ctx.beginPath(); ctx.ellipse(0, my + 1.6, 1.5, .9, 0, 0, TAU); ctx.fill();
      break;
    case 'Smirk':
      ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(-3, my); ctx.quadraticCurveTo(.5, my + 1.8, 3.8, my - 1.6); ctx.stroke(); ctx.lineWidth = 1.3;
      break;
    case 'Tongue':
      smile(); ctx.beginPath(); ctx.ellipse(1, my + 1.5, 1.8, 2.2, 0, 0, Math.PI); fs('#ff7f97');
      break;
    case 'Flat':
      ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-3, my); ctx.lineTo(3, my); ctx.stroke(); ctx.lineWidth = 1.3;
      break;
    case 'Teeth':
      rrPath(ctx, -4, my - 1.8, 8, 3.8, 1.5); fs('#fff');
      ctx.lineWidth = .7; ctx.beginPath(); ctx.moveTo(-4, my + .1); ctx.lineTo(4, my + .1);
      for (const k of [-1.4, 1.4]) { ctx.moveTo(k, my - 1.8); ctx.lineTo(k, my + 2); }
      ctx.stroke(); ctx.lineWidth = 1.3;
      break;
    case 'Moustache':
      smile();
      for (const sd of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sd * 2.6, my - 2.9, 3.2, 1.5, sd * -.25, 0, TAU); fs(c.hairColor); }
      break;
  }
}

function capPath(hw, hh, cy, style) {

  ctx.ellipse(0, cy, R, Rv, 0, Math.PI, TAU);
  ctx.lineTo(R, sideY);
  if (style === 'zig') {
    ctx.lineTo(hw * .82, fy);
    for (let i = 1; i <= 6; i++) ctx.lineTo(hw * .82 - i * hw * .82 * 2 / 6, i % 2 ? fy + 3.5 : fy - .5);

    ctx.lineTo(hw * .85, fy - 1); ctx.quadraticCurveTo(0, fy + 7, -hw * .85, fy + 2);

  }

}
function drawHairBack(c, g, hw, hh) {
  const cy = g.headCY, hc = c.hairColor;

    case 'Long': rrPath(ctx, -hw - 2.6, cy - hh * .3, hw * 2 + 5.2, g.torsoTop + 9 - (cy - hh * .3), 6); fs(hc); break;
    case 'Afro': ctx.beginPath(); ctx.arc(0, cy - hh * .2, Math.max(hw, hh) * 1.42, 0, TAU); fs(hc); break;
    case 'Curly': for (const sd of [-1, 1]) { ctx.beginPath(); ctx.arc(sd * hw, cy + hh * .15, 4.6, 0, TAU); fs(hc); } break;
    case 'Ponytail':

      break;

function drawHairFront(c, g, hw, hh) {
  const cy = g.headCY, hc = c.hairColor;
  switch (c.hair) {
    case 'Short': capPath(hw, hh, cy, 'smooth'); fs(hc); break;
    case 'Spiky':
      ctx.beginPath();
      for (let i = -2; i <= 2; i++) {

      for (const sd of [-1, 1]) { rrPath(ctx, sd > 0 ? hw - 1.8 : -hw - 2.4, cy - 2, 4.2, hh * 1.05, 2); fs(hc); }
      break;

   ===================================================================== */
const WW = 3600, WH = 3000, TSC = .5;
const PLAZA = { x: 1800, y: 1560 }, VOLC = { x: 1800, y: 690 }, LOOKOUT = { x: 1800, y: 1080 };
const SEED = 88;
function hash(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(SEED, 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) { let s = 0, a = .5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= .5; } return s / .9375; }
let BUMPS = [];
// > 0 is land, < 0 is sea
function landVal(x, y) {
  const dx = (x - WW / 2) / (WW * .43), dy = (y - WH / 2) / (WH * .43);
  let v = 1 - Math.sqrt(dx * dx + dy * dy) + (fbm(x / 650 + 3.1, y / 650 + 7.7) - .5) * .6;
  for (const b of BUMPS) {
    const d2 = (x - b.x) ** 2 + (y - b.y) ** 2;
    if (d2 < b.r * b.r) { const bv = b.h * (1 - d2 / (b.r * b.r)); if (bv > v) v = bv; }
  }
  return v;
}

  for (let k = 0; k < 16; k++) { const a = k / 16 * TAU; g.beginPath(); g.moveTo(PLAZA.x + Math.cos(a) * 70, PLAZA.y + Math.sin(a) * 70); g.lineTo(PLAZA.x + Math.cos(a) * 205, PLAZA.y + Math.sin(a) * 205); g.stroke(); }
  for (const s of SPORTS) paintVenue(g, s);
  g.setTransform(1, 0, 0, 1, 0, 0);

  minimap = document.createElement('canvas'); minimap.width = 180; minimap.height = 150;

  bigmap = document.createElement('canvas'); bigmap.width = 600; bigmap.height = 500;
  bigmap.getContext('2d').drawImage(terrain, 0, 0, 600, 500);

  // sparkles on the shallows
  const srng = mulberry(9);
  for (let i = 0; i < 6000 && sparkles.length < 700; i++) {

    if (v < -.005 && v > -.2) sparkles.push({ x, y, p: srng() * TAU, l: 6 + srng() * 10 });
  }
  buildProps();
  buildNPCs();
  buildPads();
  snapVolcano();
  if (save.champion) paintBloom();
}

function paintVenue(g, s) {
  const { x, y } = s;
  g.save(); g.lineWidth = 5; g.strokeStyle = '#fff'; g.lineJoin = 'miter'; g.lineCap = 'butt';
  switch (s.id) {
    case 'soccer': {

      for (let i = 0; i < 10; i++) { g.fillStyle = i % 2 ? '#58b843' : '#4caa38'; g.fillRect(l + i * w / 10, t, w / 10 + 1, h); }
      g.strokeRect(l, t, w, h);
      g.beginPath(); g.moveTo(x, t); g.lineTo(x, t + h); g.stroke();
      g.beginPath(); g.arc(x, y, 45, 0, TAU); g.stroke();
      g.strokeRect(l, y - 75, 70, 150); g.strokeRect(l + w - 70, y - 75, 70, 150);
      g.fillStyle = 'rgba(255,255,255,.4)'; g.fillRect(l - 24, y - 45, 24, 90); g.fillRect(l + w, y - 45, 24, 90);
      g.strokeRect(l - 24, y - 45, 24, 90); g.strokeRect(l + w, y - 45, 24, 90);
      break;
    }
    case 'basketball': {
      const w = 370, h = 220, l = x - w / 2, t = y - h / 2;
      g.fillStyle = '#c8723f'; g.fillRect(l - 14, t - 14, w + 28, h + 28);
      g.fillStyle = '#e09156'; g.fillRect(l, t, w, h);
      g.strokeRect(l, t, w, h); g.beginPath(); g.moveTo(x, t); g.lineTo(x, t + h); g.stroke();
      g.beginPath(); g.arc(x, y, 34, 0, TAU); g.stroke();
      g.fillStyle = '#c4633a'; g.fillRect(l, y - 40, 80, 80); g.fillRect(l + w - 80, y - 40, 80, 80);
      g.strokeRect(l, y - 40, 80, 80); g.strokeRect(l + w - 80, y - 40, 80, 80);
      g.beginPath(); g.arc(l, y, 130, -1.2, 1.2); g.stroke(); g.beginPath(); g.arc(l + w, y, 130, Math.PI - 1.2, Math.PI + 1.2); g.stroke();

    }
    case 'tennis': {
      g.fillStyle = '#3d8f5c'; g.fillRect(x - 160, y - 230, 320, 460);
      const w = 220, h = 380, l = x - w / 2, t = y - h / 2;
      g.fillStyle = '#3a78c9'; g.fillRect(l, t, w, h);
      g.strokeRect(l, t, w, h); g.strokeRect(l + 26, t, w - 52, h);
      g.beginPath(); g.moveTo(l + 26, y - 100); g.lineTo(l + w - 26, y - 100); g.moveTo(l + 26, y + 100); g.lineTo(l + w - 26, y + 100);
      g.moveTo(x, y - 100); g.lineTo(x, y + 100); g.stroke();
      g.fillStyle = '#222'; g.fillRect(l - 14, y - 4, w + 28, 8); g.fillStyle = '#fff'; g.fillRect(l - 14, y - 4, w + 28, 3);
      break;
    }
    case 'archery': {
      g.fillStyle = '#9ad86e'; g.fillRect(x - 150, y - 230, 300, 400);
      g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 4;
      for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(x - 150, y + 150 - k * 95); g.lineTo(x + 150, y + 150 - k * 95); g.stroke(); }
      g.fillStyle = '#e8b04a'; for (const k of [-110, 110]) { g.fillRect(x + k - 22, y - 140, 44, 26); }
      break;
    }
    case 'golf': {
      g.fillStyle = '#4fa33c'; g.beginPath(); g.ellipse(x, y, 190, 130, .2, 0, TAU); g.fill();
      g.fillStyle = '#93e073'; g.beginPath(); g.ellipse(x, y, 170, 112, .2, 0, TAU); g.fill();
      g.fillStyle = '#f2df9c'; g.beginPath(); g.ellipse(x - 90, y + 60, 48, 26, -.3, 0, TAU); g.fill();
      g.fillStyle = '#4bb3e6'; g.beginPath(); g.ellipse(x + 95, y - 55, 44, 24, .3, 0, TAU); g.fill();
      g.fillStyle = '#111'; g.beginPath(); g.arc(x + 20, y - 10, 9, 0, TAU); g.fill();
      break;
    }
    case 'sprint': {
      rrPath(g, x - 280, y - 160, 560, 320, 160); g.fillStyle = '#c8553d'; g.fill();
      rrPath(g, x - 220, y - 100, 440, 200, 100); g.fillStyle = '#6fc04c'; g.fill(); g.lineWidth = 4; g.stroke();
      g.lineWidth = 2; g.strokeStyle = 'rgba(255,255,255,.75)';
      for (const k of [15, 30, 45]) { rrPath(g, x - 220 - k, y - 100 - k, 440 + k * 2, 200 + k * 2, 100 + k); g.stroke(); }
      for (let i = 0; i < 6; i++) for (let j = 0; j < 2; j++) { g.fillStyle = (i + j) % 2 ? '#fff' : '#111'; g.fillRect(x + 40 + j * 10, y + 100 + i * 10, 10, 10); }
      break;
    }
    case 'bowling': {
      g.fillStyle = '#cfc4b2'; g.fillRect(x - 190, y - 200, 380, 250);
      g.fillStyle = '#b8ab95'; for (let i = 0; i < 6; i++) g.fillRect(x - 190 + i * 66, y + 10, 40, 6);

    case 'surf': {
      const tw = [['#e8443a', -150, 25], ['#ffd23a', 120, 20], ['#3a66e8', 190, 40]];
      for (const [col, dx, dy] of tw) { g.fillStyle = col; g.fillRect(x + dx, y + dy - 10, 40, 64); g.fillStyle = 'rgba(255,255,255,.6)'; g.fillRect(x + dx, y + dy + 4, 40, 6); }

}

/* ---- things that stand up off the ground (sorted by y so they overlap properly) ---- */
function addProp(x, y, draw, col) { props.push({ x, y, draw }); if (col) colliders.push(col); }
function buildProps() {
  props = []; colliders = [];
  // the 88 fountain
  addProp(PLAZA.x, PLAZA.y + 40, drawFountain, { x: PLAZA.x, y: PLAZA.y, r: 92 });
  // venue furniture
  for (const s of SPORTS) {
    const { x, y } = s;
    if (s.id === 'basketball') for (const sd of [-1, 1]) addProp(x + sd * 200, y, () => drawHoop(x + sd * 200, y, -sd), { x: x + sd * 200, y, r: 10 });
    if (s.id === 'archery') for (const k of [-90, 0, 90]) addProp(x + k, y - 175 + Math.abs(k) / 5, () => drawTarget(x + k, y - 175 + Math.abs(k) / 5), { x1: x + k - 30, y1: y - 190, x2: x + k + 30, y2: y - 150 });
    if (s.id === 'golf') addProp(x + 20, y - 10, () => drawFlag(x + 20, y - 10));
    if (s.id === 'bowling') addProp(x, y, () => drawBowlingHouse(x, y), { x1: x - 160, y1: y - 175, x2: x + 160, y2: y - 4 });
    if (s.id === 'surf') {
      addProp(x - 120, y - 30, () => drawShack(x - 120, y - 30), { x1: x - 185, y1: y - 75, x2: x - 55, y2: y - 30 });
      for (const [k, col] of [[60, '#ff6f3a'], [90, '#3ac6e8'], [120, '#ffd23a']]) addProp(x + k, y - 20, () => drawBoard(x + k, y - 20, col));
      addProp(x + 210, y + 10, () => drawUmbrella(x + 210, y + 10, '#e8443a'));
    }
    if (s.id === 'tennis') for (const sd of [-1, 1]) addProp(x + sd * 124, y + 4, () => drawPost(x + sd * 124, y + 4));
    // signpost beside every coach
    const sx = x + s.co[0] + 70, sy = y + s.co[1] + 6;
    addProp(sx, sy, () => drawSign(sx, sy, s.icon + ' ' + s.place), { x: sx, y: sy, r: 8 });
  }
  addProp(LOOKOUT.x + 70, LOOKOUT.y + 10, () => drawSign(LOOKOUT.x + 70, LOOKOUT.y + 10, isBloomed() ? '🌸 Blossom Lookout' : '🌋 Volcano Lookout'), { x: LOOKOUT.x + 70, y: LOOKOUT.y + 10, r: 8 });
  placeHotel();
  // huts around the plaza, wherever a path isn't
  const hrng = mulberry(31), roofs = ['#d19a45', '#e8443a', '#3a9ad9', '#8a4ae8', '#44c45a'];
  let huts = 0;
  for (let k = 0; k < 40 && huts < 6; k++) {
    const a = k / 40 * TAU * 3 + .2, r = 330 + (k % 3) * 70, x = PLAZA.x + Math.cos(a) * r, y = PLAZA.y + Math.sin(a) * r;
    if (distToPaths(x, y) < 120 || props.some(p => Math.hypot(p.x - x, p.y - y) < 200) || Math.hypot(x - GH.x, y - GH.y) < 330) continue;
    const roof = roofs[huts % roofs.length]; huts++;
    addProp(x, y, () => drawHut(x, y, roof), { x1: x - 62, y1: y - 45, x2: x + 62, y2: y });
  }
  // palm trees, bushes and rocks
  const rng = mulberry(881), trees = [];
  for (let i = 0; i < 5000 && trees.length < 300; i++) {
    const x = rng() * WW, y = rng() * WH, v = landVal(x, y);
    if (v < .03) continue;
    if (Math.hypot(x - PLAZA.x, y - PLAZA.y) < 330 || Math.hypot(x - VOLC.x, y - VOLC.y) < 430) continue;
    if (SPORTS.some(s => Math.hypot(x - s.x, y - s.y) < (s.id === 'surf' ? 260 : 340))) continue;
    if (distToPaths(x, y) < 70 || trees.some(t => Math.hypot(t.x - x, t.y - y) < 70)) continue;
    if (props.some(p => Math.hypot(p.x - x, p.y - y) < 110) || Math.hypot(x - GH.x, y - GH.y) < 300) continue;
    const r = rng(), t = { x, y };
    if (v < .13 || r < .55) {
      const h = 80 + rng() * 50, lean = (rng() - .5) * 50, seed = rng() * 10;
      addProp(x, y, () => drawPalm(x, y, h, lean, seed), { x, y, r: 12 });
    } else if (r < .85) {
      const s = .8 + rng() * .5, berry = rng() < .4;
      addProp(x, y, () => drawBush(x, y, s, berry), { x, y, r: 18 * s });
    } else {
      const s = .7 + rng() * .7;
      addProp(x, y, () => drawRock(x, y, s), { x, y, r: 18 * s });
    }
    trees.push(t);
  }
}

function updWorld(dt) {
  const free = !dlg && !overlay && !bloomFx;
  if (bloomFx) updBloom(dt);
  // ---- the player ----
  let mx = 0, my = 0;
  if (free) {
    if (keys['ArrowLeft'] || keys['a']) mx -= 1;
    if (keys['ArrowRight'] || keys['d']) mx += 1;
    if (keys['ArrowUp'] || keys['w']) my -= 1;
    if (keys['ArrowDown'] || keys['s']) my += 1;
    for (const t of touches.values()) if (t.joy) {
      const dx = t.x - t.sx, dy = t.y - t.sy, d = Math.hypot(dx, dy);
      if (d > 6) { const k = Math.min(1, d / 55); mx += dx / d * k; my += dy / d * k; }
    }
  }
  const m = Math.hypot(mx, my);
  if (m > 1) { mx /= m; my /= m; }
  P.moving = m > .1;
  if (P.moving) {
    const run = keys['Shift'] || m > .98 && isTouch;
    const sp = (run ? 360 : 230) * dt;
    const nx = P.x + mx * sp, ny = P.y + my * sp;
    if (!blocked(nx, P.y, 11)) P.x = nx;
    if (!blocked(P.x, ny, 11)) P.y = ny;
    P.walk += dt * (run ? 14 : 10) * Math.min(1, m);
    P.back = my < -.35 && Math.abs(my) > Math.abs(mx) * .5;
    P.stepT -= dt; if (P.stepT <= 0) { sfx('step'); P.stepT = run ? .22 : .32; }
  }
  // ---- everyone else ----
  for (const n of npcs) {
    if (!n.wander || (dlg && dlg.name === n.name)) { n.moving = false; continue; }
    if (n.idle > 0) { n.idle -= dt; n.moving = false; continue; }
    const dx = n.tx - n.x, dy = n.ty - n.y, d = Math.hypot(dx, dy);
    if (d < 6) {
      n.idle = rand(1, 4); const a = rand(0, TAU), r = rand(40, n.wander);
      n.tx = n.hx + Math.cos(a) * r; n.ty = n.hy + Math.sin(a) * r;
      if (blocked(n.tx, n.ty, 14)) { n.tx = n.x; n.ty = n.y; }
      continue;
    }
    const nx = n.x + dx / d * 60 * dt, ny = n.y + dy / d * 60 * dt;
    if (blocked(nx, ny, 10)) { n.tx = n.x; n.ty = n.y; n.idle = 1; }
    else { n.x = nx; n.y = ny; n.moving = true; n.walk += dt * 9; n.back = dy < -Math.abs(dx) * .5; }
  }
  // who's close enough to talk to?
  nearNPC = null; let bd = 85;
  for (const n of npcs) { const d = dist(n.x, n.y, P.x, P.y); if (d < bd) { bd = d; nearNPC = n; } }
  const doorD = dist(P.x, P.y, GH.x, GH.y + 26);
  nearDoor = doorD < 80 && (!nearNPC || doorD < bd);
  if (nearDoor) nearNPC = null;
  nearFlower = isBloomed() && !bloomFx && !nearDoor && !nearNPC && dist(P.x, P.y, VOLC.x, VOLC.y) < 250;
  flowerWiggle = Math.max(0, flowerWiggle - dt * 1.2);
  const actBtn = { x: W - 92, y: H - 128, r: 48 };
  if (free) {
    const tapAct = isTouch && ptr.pressed && dist(ptr.x, ptr.y, actBtn.x, actBtn.y) < actBtn.r;
    if (nearDoor && (kp['e'] || kp[' '] || kp['enter'] || tapAct)) { enterHotel(); return; }
    else if (nearFlower && (kp['e'] || kp[' '] || kp['enter'] || tapAct)) touchFlower();
    else if (isBloomed() && !bloomFx && ptr.released && dist(ptr.sx, ptr.sy, ptr.x, ptr.y) < 12 && !(isTouch && ptr.x > W - 150 && ptr.y > H - 190) &&
      dist(ptr.x + cam.x, ptr.y + cam.y, VOLC.x, VOLC.y) < 175) touchFlower();
    else if (nearNPC && (kp['e'] || kp[' '] || kp['enter'] || tapAct)) talkTo(nearNPC);
    else if (kp['m']) openOverlay('map');
    else if (kp['o']) openOverlay('online');
    else if (kp['q'] || kp['Tab']) openOverlay('scores');
    else if (kp['c']) { enterCreator(false); return; }
    else if (kp['Escape']) { goTitle(); return; }
    visibleEmotes().forEach((em, i) => { if (kp[String(i + 1)]) doEmote(em.id); });
  } else if (overlay && overlay !== 'celebrate' && frameNo > overlayFrame && (kp['Escape'] || kp['m'] || kp['q'] || kp['Tab'])) { overlay = null; }
  // emotes tick, and walking away stops yours
  if (P.emote) { P.emote.t += dt; if (P.emote.t > 2.6 || (P.moving && P.emote.t > .15)) P.emote = null; }
  for (const n of npcs) if (n.emote) { n.emote.t += dt; if (n.emote.t > 2.6) n.emote = null; }
  updRemotes(dt);
  // stepping on a teleport spot for the first time
  for (const pd of PADS) if (!save.tp.includes(pd.id) && dist(pd.x, pd.y, P.x, P.y) < 40) {
    save.tp.push(pd.id); writeSave(); sfx('win'); tpFx = 1;
    showToast(`🌀 Teleport spot found: ${pd.name}! Open the map to zoom back here.`);
  }
  tpFx = Math.max(0, tpFx - dt * 1.3);
  if (toast) { toast.t += dt; if (toast.t > 3.5) toast = null; }

  // fountain spray, volcano smoke and lava
  if (fountainDrops.length < 46) { const a = rand(0, TAU); fountainDrops.push({ x: PLAZA.x, y: PLAZA.y - 52, vx: Math.cos(a) * rand(25, 60), vy: -rand(90, 150), g: PLAZA.y + Math.sin(a) * 30 }); }
  for (const d of fountainDrops) { d.vy += 300 * dt; d.x += d.vx * dt; d.y += d.vy * dt; }
  fountainDrops = fountainDrops.filter(d => d.y < d.g);
  smokeT -= dt;
  updPetals(dt);
  petalT -= dt;
  if (isBloomed() && !bloomFx && petalT <= 0 && petals.length < 50) { petalT = .3; spawnPetals(VOLC.x + rand(-90, 90), VOLC.y + rand(-90, 60), 1, .2); }
  if (!isBloomed() && smokeT <= 0) { smoke.push({ x: VOLC.x + rand(-40, 40), y: VOLC.y - 30, r: rand(20, 34), life: 0, vx: rand(-8, 14) }); smokeT = eruptT > 0 ? .05 : .28; }
  for (const s of smoke) { s.life += dt; s.y -= (eruptT > 0 ? 90 : 34) * dt; s.x += s.vx * dt; s.r += 9 * dt; }
  smoke = smoke.filter(s => s.life < 5);
  if (eruptT > 0) {
    eruptT -= dt;
    for (let i = 0; i < 3; i++) lava.push({ x: VOLC.x + rand(-30, 30), y: VOLC.y - 20, vx: rand(-200, 200), vy: -rand(300, 560), life: 0 });
  }
  for (const l of lava) { l.life += dt; l.vy += 520 * dt; l.x += l.vx * dt; l.y += l.vy * dt; }
  lava = lava.filter(l => l.life < 1.6);

  // camera
  const fx = bloomFx ? VOLC.x : P.x, fy = bloomFx ? VOLC.y + 40 : P.y;
  const tx = clamp(fx - W / 2, 0, WW - W), ty = clamp(fy - H / 2 - 30, 0, WH - H), ck = Math.min(1, dt * (bloomFx ? 2.2 : 7));
  cam.x += (tx - cam.x) * ck; cam.y += (ty - cam.y) * ck;
  saveT += dt; if (saveT > 3) { saveT = 0; save.pos = { x: P.x, y: P.y }; writeSave(); }

  drawWorld();
  if (!bloomFx) drawHUD(actBtn);
  drawBloomOverlay();
  if (overlay === 'map') drawBigMap();
  else if (overlay === 'scores') drawScores();
  else if (overlay === 'online') drawOnline();
  else if (overlay === 'celebrate') drawCelebrate(dt);
  if (dlg) updDlg(dt);
}

/* =====================================================================
   🏃 RUNNING — Beach Sprint

function Sprint() {

    ctx.fillStyle = 'rgba(255,255,255,.5)'; for (let i = 0; i < 20; i++) { const x = ((i * 97 - camX * .3) % 1000 + 1000) % 1000 - 20; ctx.fillRect(x, 120 + (i % 4) * 12, 26, 2); }
    for (let i = 0; i < 8; i++) { const x = ((i * 260 - camX * .5) % 2080 + 2080) % 2080 - 100; drawPalmSil(x, 196, 70 + (i % 3) * 14, '#3f8f45'); }
    ctx.fillStyle = '#f2dfa2'; ctx.fillRect(0, 170, W, H - 170);
    for (let i = 0; i < 4; i++) { ctx.fillStyle = i % 2 ? '#ecd18f' : '#f5dc9e'; ctx.fillRect(0, LANE0 + i * LANEH, W, LANEH); }
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    for (let i = 0; i <= 4; i++) { ctx.beginPath(); ctx.moveTo(0, LANE0 + i * LANEH); ctx.lineTo(W, LANE0 + i * LANEH); ctx.stroke(); }
    for (let m = 0; m <= 100; m += 10) {
      const x = m * PXM - camX; if (x < -40 || x > W + 40) continue;
      ctx.strokeStyle = m === 0 ? '#fff' : 'rgba(255,255,255,.55)'; ctx.lineWidth = m === 0 ? 6 : 2;
      ctx.beginPath(); ctx.moveTo(x, LANE0); ctx.lineTo(x, LANE0 + 4 * LANEH); ctx.stroke();
      txt(`${m}m`, x, LANE0 - 14, 14, '#8a6a2a');
    }
    const fx = 100 * PXM - camX;
    for (let j = 0; j < 28; j++) for (let k = 0; k < 2; k++) { ctx.fillStyle = (j + k) % 2 ? '#111' : '#fff'; ctx.fillRect(fx + k * 10 - 10, LANE0 + j * 10, 10, 10); }
    HURD.forEach((m, i) => {
      const x = m * PXM - camX; if (x < -40 || x > W + 40) return;
      for (let lane = 0; lane < 4; lane++) {
        const base = LANE0 + lane * LANEH + 58, down = g.down[i][lane] || (lane < 3 && false);
        ctx.strokeStyle = '#1d2b3a'; ctx.lineWidth = 2;
        if (down) { ctx.fillStyle = '#e8443a'; ctx.fillRect(x - 4, base - 6, 34, 6); ctx.strokeRect(x - 4, base - 6, 34, 6); }
        else {
          ctx.fillStyle = '#ddd'; ctx.fillRect(x - 2, base - 34, 4, 34); ctx.fillRect(x + 22, base - 46, 4, 34);
          ctx.save(); ctx.translate(x, base - 34); ctx.rotate(-.42);
          ctx.fillStyle = '#fff'; ctx.fillRect(-2, -5, 32, 8); ctx.fillStyle = '#e8443a'; ctx.fillRect(6, -5, 8, 8); ctx.fillRect(22, -5, 8, 8); ctx.strokeRect(-2, -5, 32, 8);
          ctx.restore();
        }
      }
    });
    cpus.forEach((c, i) => {
      const near = HURD.find(m => Math.abs(c.d - m) < .9), air = near != null ? 1 - (near + .9 - c.d) / 1.8 : 0;
      runner(c.c, c.d, i, air, c.name, '#fffdf3');
    });
    runner(save.char, g.d, 3, g.air > 0 ? 1 - g.air / .55 : 0, 'YOU', '#ffd23a');
    // speed meter
    panel(310, H - 84, 300, 54, '#fffdf3', 12);
    txt('SPEED', 330, H - 57, 14, '#8a7a60', 'left');
    ctx.fillStyle = '#e3d9c2'; ctx.fillRect(390, H - 70, 200, 26);
    ctx.fillStyle = g.v > 9.5 ? '#5ad35a' : g.v > 6 ? '#ffd23a' : '#ff8a26'; ctx.fillRect(390, H - 70, 200 * g.v / 12.5, 26);
    ctx.strokeStyle = '#1d2b3a'; ctx.lineWidth = 2; ctx.strokeRect(390, H - 70, 200, 26);
    // buttons (they work with a mouse too)
    for (const [r, lab, lit] of [[BL, '◀ L', g.last === 'L'], [BRt, 'R ▶', g.last === 'R'], [BJ, 'JUMP', g.air > 0]]) {
      rrPath(ctx, r.x, r.y, r.w, r.h, 14); ctx.fillStyle = lit ? '#ffd23a' : 'rgba(255,253,243,.9)'; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#1d2b3a'; ctx.stroke(); txt(lab, r.x + r.w / 2, r.y + r.h / 2, 24, '#1d2b3a');
    }
    if (g.phase === 'count') {
      const n = Math.ceil(g.cd);
      txt(n > 3 ? 'Get ready…' : String(n), W / 2, 330, n > 3 ? 48 : 110, '#ffd23a', 'center', { weight: 900, stroke: '#1d2b3a', sw: 10 });
      txt(isTouch ? 'Tap L, R, L, R… and JUMP the hurdles!' : 'Press ← → ← → … and Space to jump!', W / 2, 410, 22, '#fff', 'center', { stroke: '#1d2b3a', sw: 6 });
    }
    gameHud('Beach Sprint', `⏱ ${(g.fin ?? g.t).toFixed(2)}s`, `${Math.min(100, g.d).toFixed(0)} m / 100`);
    bigMsg(g);
  };
  return g;
}

/* =====================================================================
   🎳 BOWLING — Strike Shack
   ===================================================================== */
function Bowling() {
  const LX = 380, LW = 200, FOUL = 545, HEADY = 196, BRAD = 14, PR = 9, FRAMES = 3;
  const g = { done: false, points: 0, frame: 0, roll: 0, total: 0, frames: [], phase: 'pos', t: 0, bx: 480, ang: 0, pw: 0, ball: null, pins: [], msgT: 0, strikes: 0, spares: 0, rollT: 0 };
  function rack() {
    g.pins = [];
    for (let r = 0; r < 4; r++) for (let i = 0; i <= r; i++) {
      const x = 480 + (i - r / 2) * 40, y = HEADY - r * 36;
      g.pins.push({ x, y, x0: x, y0: y, vx: 0, vy: 0, down: false, gone: false, removed: false, rot: rand(0, TAU) });
    }
  }
  rack();
  function resetBall() { g.phase = 'pos'; g.t = 0; g.ball = null; }
  function roll() {
    const sp = lerp(450, 1050, g.pw);
    g.ball = { x: g.bx, y: FOUL - 10, vx: Math.sin(g.ang) * sp, vy: -Math.cos(g.ang) * sp, gutter: false, gone: false, rot: 0 };
    g.phase = 'roll'; g.rollT = 0; sfx('rumble');
  }
  function collide(a, b, ra, rb, ma, mb, e) {
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d >= ra + rb || d === 0) return false;
    const nx = dx / d, ny = dy / d, vrel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    const over = ra + rb - d, ta = mb / (ma + mb), tb = ma / (ma + mb);
    a.x -= nx * over * ta; a.y -= ny * over * ta; b.x += nx * over * tb; b.y += ny * over * tb;
    if (vrel <= 0) return true;
    const j = (1 + e) * vrel / (1 / ma + 1 / mb);
    a.vx -= j / ma * nx; a.vy -= j / ma * ny; b.vx += j / mb * nx; b.vy += j / mb * ny;
    return true;
  }
  function phys(dt) {
    const b = g.ball;
    if (b && !b.gone) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.rot += dt * 8;
      if (!b.gutter && (b.x < LX + 2 || b.x > LX + LW - 2)) { b.gutter = true; b.x = b.x < 480 ? LX - 12 : LX + LW + 12; b.vx = 0; sfx('thunk'); }
      if (b.y < 26) b.gone = true;
    }
    for (const p of g.pins) {
      if (p.gone || p.removed) continue;
      if (b && !b.gone && !b.gutter && collide(b, p, BRAD, PR, 6, 1, .8)) { p.vx += rand(-40, 40); p.down = true; sfx('pin'); }
      p.x += p.vx * dt; p.y += p.vy * dt;
      const f = Math.exp(-1.5 * dt); p.vx *= f; p.vy *= f;
      if (Math.hypot(p.x - p.x0, p.y - p.y0) > 5) p.down = true;
      if (p.x < LX - 4 || p.x > LX + LW + 4 || p.y < 26) p.gone = true;
    }
    for (let i = 0; i < g.pins.length; i++) for (let k = i + 1; k < g.pins.length; k++) {
      const a = g.pins[i], c = g.pins[k];
      if (a.gone || c.gone || a.removed || c.removed) continue;
      if (collide(a, c, PR, PR, 1, 1, .85) && Math.hypot(a.vx - c.vx, a.vy - c.vy) > 20) { a.down = c.down = true; }
    }
  }
  function settle() {
    const knocked = g.pins.filter(p => !p.removed && (p.down || p.gone)).length;
    const fr = g.frames[g.frame] || (g.frames[g.frame] = []);
    fr.push(knocked); g.total += knocked;
    if (g.roll === 0 && knocked === 10) { g.strikes++; setMsg(g, 'STRIKE!', '#ffd23a', 300); sfx('cheer'); return 'next'; }
    if (g.roll === 1 && fr[0] + knocked === 10) { g.spares++; setMsg(g, 'SPARE!', '#5ad35a', 300); sfx('cheer'); return 'next'; }
    setMsg(g, knocked === 0 ? 'GUTTER!' : `${knocked} pin${knocked === 1 ? '' : 's'}`, knocked ? '#fff' : '#ff9a8a', 300);
    sfx(knocked ? 'pin' : 'fail');
    return g.roll === 0 ? 'second' : 'next';
  }
  g.update = dt => {
    g.t += dt; g.msgT -= dt;
    if (g.phase === 'pos') { g.bx = 480 + Math.sin(g.t * 1.8) * 70; if (act()) { g.phase = 'aim'; g.t = 0; sfx('click'); } }
    else if (g.phase === 'aim') { g.ang = Math.sin(g.t * 2.2) * .12; if (act()) { g.phase = 'power'; g.t = 0; sfx('click'); } }
    else if (g.phase === 'power') { g.pw = (1 - Math.cos(g.t * 3.4)) / 2; if (act()) roll(); }
    else if (g.phase === 'roll') {
      g.rollT += dt;
      for (let i = 0; i < 6; i++) phys(dt / 6);
      const moving = g.pins.some(p => !p.gone && !p.removed && Math.hypot(p.vx, p.vy) > 6);
      if ((g.ball.gone && !moving) || g.rollT > 5) { g.phase = 'wait'; g.t = 0; g.next = settle(); }
    } else if (g.phase === 'wait' && g.t > 1.5) {
      if (g.next === 'second') { for (const p of g.pins) if (p.down || p.gone) p.removed = true; g.roll = 1; resetBall(); }
      else {
        g.frame++; g.roll = 0;
        if (g.frame >= FRAMES) { g.done = true; g.points = Math.round(g.total * 11 / 30); g.summary = `${g.total} pins · ${g.strikes} strike${g.strikes === 1 ? '' : 's'} · ${g.spares} spare${g.spares === 1 ? '' : 's'}`; }
        else { rack(); resetBall(); }
      }
    }
  };
  g.draw = () => {
    ctx.fillStyle = '#2a1f3d'; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 30; i++) { ctx.fillStyle = `hsla(${(i * 47 + now * 40) % 360},90%,65%,.35)`; ctx.beginPath(); ctx.arc((i * 131) % W, (i * 71) % H, 3 + (i % 3), 0, TAU); ctx.fill(); }
    for (const sx of [LX - 220, LX + LW + 200]) { ctx.fillStyle = 'rgba(232,194,138,.25)'; ctx.fillRect(sx, 40, 120, FOUL - 40); }
    ctx.fillStyle = '#c79a62'; ctx.fillRect(LX - 60, FOUL, LW + 120, H - FOUL);
    ctx.fillStyle = '#4a4a55'; ctx.fillRect(LX - 24, 26, 24, FOUL - 26); ctx.fillRect(LX + LW, 26, 24, FOUL - 26);
    const wood = ctx.createLinearGradient(0, 26, 0, FOUL); wood.addColorStop(0, '#f1d39a'); wood.addColorStop(1, '#ddaa66');
    ctx.fillStyle = wood; ctx.fillRect(LX, 26, LW, FOUL - 26);
    ctx.strokeStyle = 'rgba(120,70,20,.15)'; ctx.lineWidth = 1;
    for (let x = LX; x <= LX + LW; x += 10) { ctx.beginPath(); ctx.moveTo(x, 26); ctx.lineTo(x, FOUL); ctx.stroke(); }
    ctx.fillStyle = '#8a3a1a';
    for (let k = 0; k < 7; k++) { const x = LX + 25 + k * 25, y = 420 + Math.abs(k - 3) * 8; ctx.beginPath(); ctx.moveTo(x, y - 9); ctx.lineTo(x - 5, y + 4); ctx.lineTo(x + 5, y + 4); ctx.fill(); }
    ctx.fillStyle = '#111'; ctx.fillRect(LX - 24, 0, LW + 48, 26);
    ctx.fillStyle = '#e8443a'; ctx.fillRect(LX - 24, FOUL - 2, LW + 48, 4);
    for (const p of g.pins) {
      if (p.gone || p.removed) continue;
      if (p.down) {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.beginPath(); ctx.ellipse(0, 0, 14, 6, 0, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#1d2b3a'; ctx.stroke();
        ctx.fillStyle = '#e8443a'; ctx.fillRect(-3, -5.5, 3, 11); ctx.restore();
      } else {
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(p.x + 2, p.y + 3, PR, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(p.x, p.y, PR, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#1d2b3a'; ctx.stroke();
        ctx.beginPath(); ctx.arc(p.x, p.y, PR - 3.5, 0, TAU); ctx.strokeStyle = '#e8443a'; ctx.lineWidth = 2.5; ctx.stroke();
      }
    }
    const b = g.ball, bx = b ? b.x : g.bx, by = b ? b.y : FOUL - 10;
    if (!b || !b.gone) {
      ctx.save(); ctx.translate(bx, by); ctx.rotate(b ? b.rot : 0);
      ctx.beginPath(); ctx.arc(0, 0, BRAD, 0, TAU); ctx.fillStyle = save.char.shirtColor; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#1d2b3a'; ctx.stroke();
      ctx.fillStyle = '#1d2b3a'; for (const [x, y] of [[-4, -5], [3, -6], [0, 1]]) { ctx.beginPath(); ctx.arc(x, y, 2, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
    if (g.phase === 'aim' || g.phase === 'power') {
      ctx.strokeStyle = '#ffd23a'; ctx.lineWidth = 4; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.moveTo(g.bx, FOUL - 10); ctx.lineTo(g.bx + Math.sin(g.ang) * 200, FOUL - 10 - Math.cos(g.ang) * 200); ctx.stroke(); ctx.setLineDash([]);
    }
    if (g.phase === 'power') {
      const mx = LX + LW + 50, my = 300, mh = 200;
      panel(mx - 6, my - 6, 38, mh + 12, '#fffdf3', 8);
      const gr = ctx.createLinearGradient(0, my + mh, 0, my); gr.addColorStop(0, '#5ad35a'); gr.addColorStop(1, '#e8443a');
      ctx.fillStyle = gr; ctx.fillRect(mx, my + mh * (1 - g.pw), 26, mh * g.pw);
      txt('POWER', mx + 13, my + mh + 22, 13, '#fff');
    }
    if (g.phase !== 'roll' && g.phase !== 'wait') drawChar(save.char, g.bx + 34, 640, 2, { back: true, idle: true });
    // score card
    panel(640, 60, 300, 150, '#fffdf3', 14);
    txt('SCORE CARD', 790, 82, 15, '#8a7a60');
    for (let i = 0; i < FRAMES; i++) {
      const x = 656 + i * 92, fr = g.frames[i] || [];
      ctx.strokeStyle = '#1d2b3a'; ctx.lineWidth = 2; ctx.strokeRect(x, 98, 84, 70); ctx.strokeRect(x + 42, 98, 42, 28);
      const mark = (v, k) => v == null ? '' : (k === 0 && v === 10) ? 'X' : (k === 1 && fr[0] + v === 10) ? '/' : v === 0 ? '–' : String(v);
      txt(mark(fr[0], 0), x + 21, 112, 17, '#1d2b3a'); txt(mark(fr[1], 1), x + 63, 112, 17, '#1d2b3a');
      if (fr.length) txt(String(fr.reduce((a, c) => a + c, 0)), x + 42, 148, 22, '#c0392b', 'center', { weight: 900 });
      txt(`F${i + 1}`, x + 8, 160, 10, '#8a7a60', 'left');
    }
    txt(`Total pins: ${g.total} / 30`, 790, 192, 16, '#1d2b3a');
    const tip = { pos: 'Tap to pick your spot ⟷', aim: 'Tap to pick your angle', power: 'Tap to ROLL!' }[g.phase];
    if (tip) txt(tip, 190, 330, 22, '#fff', 'center', { stroke: '#1d2b3a', sw: 6 });
    gameHud('Strike Shack', `Frame ${Math.min(g.frame + 1, FRAMES)} / ${FRAMES} · Ball ${g.roll + 1}`, `Pins ${g.total}`);
    bigMsg(g);
  };
  return g;
}

// hook each sport up to its game
const MAKERS = { soccer: Soccer, basketball: Basketball, surf: Surf, tennis: Tennis, archery: Archery, golf: Golf, sprint: Sprint, bowling: Bowling };
for (const s of SPORTS) s.make = MAKERS[s.id];

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let lastT = 0, codeShown = false;
function frame(ts) {
  const dt = Math.min(.05, Math.max(0, (ts - lastT) / 1000)); lastT = ts; now += dt; frameNo++;
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.fillStyle = '#0b3550'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  try {
    if (scene === 'title') updTitle(dt);
    else if (scene === 'creator') updCreator(dt);
    else if (scene === 'world') updWorld(dt);
    else if (scene === 'hotel') updHotel(dt);
    else if (scene === 'mini') updMini(dt);
  } catch (e) { console.error(e); }
  ctx.restore();
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.globalAlpha = 1; ctx.setLineDash([]);
  rrPath(ctx, MUTE.x, MUTE.y, MUTE.w, MUTE.h, 8); ctx.fillStyle = 'rgba(255,253,243,.8)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#1d2b3a'; ctx.stroke();
  txt(muted ? '🔇' : '🔊', MUTE.x + MUTE.w / 2, MUTE.y + MUTE.h / 2 + 1, 18);
  // online: share where I am, and show the code box only when it's needed
  if (net.room) { net.sendT -= dt; if (net.sendT <= 0) { net.sendT = .08; sendPresence(); } }
  const wantCode = scene === 'world' && overlay === 'online' && !!ROOM && !net.room && net.status !== 'joining';
  if (wantCode !== codeShown) { codeShown = wantCode; codeIn.style.display = wantCode ? 'block' : 'none'; if (!wantCode) codeIn.blur(); }
  endFrameInput();
  requestAnimationFrame(frame);
}
function boot() {
  loadSave(); resize();
  (async () => {   // online servers: only on the Claude link
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        ROOM = await window.claude.use('room');
        if (ROOM && save.server && save.char) joinServer(save.server, true);
      }
    } catch (e) { ROOM = null; }
  })();
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.fillStyle = '#0b3550'; ctx.fillRect(0, 0, W, H);
  txt('Building the Island of 88…', W / 2, H / 2, 28, '#ffd23a', 'center', { weight: 900 });
  setTimeout(() => {
    buildWorld();
    scene = 'title';
    requestAnimationFrame(t => { lastT = t; frame(t); });
  }, 30);
}
boot();
